  <script>
    (function () {
      var gate = document.getElementById('access-gate');
      var content = document.getElementById('protected-content');
      var form = document.getElementById('access-form');
      var input = document.getElementById('access-code');
      var status = document.getElementById('access-status');
      var extras = document.getElementById('protected-extras');
      var payload = JSON.parse(document.getElementById('protected-payload').textContent);
      var encoder = new TextEncoder();
      var decoder = new TextDecoder();

      function decodeBase64(value) {
        var binary = atob(value);
        var bytes = new Uint8Array(binary.length);
        for (var index = 0; index < binary.length; index += 1) {
          bytes[index] = binary.charCodeAt(index);
        }
        return bytes;
      }

      async function decryptContent(passphrase) {
        var keyMaterial = await crypto.subtle.importKey(
          'raw',
          encoder.encode(passphrase.trim().normalize('NFC')),
          'PBKDF2',
          false,
          ['deriveKey']
        );
        var key = await crypto.subtle.deriveKey(
          {
            name: 'PBKDF2',
            salt: decodeBase64(payload.salt),
            iterations: payload.iterations,
            hash: 'SHA-256'
          },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
        var plaintext = await crypto.subtle.decrypt(
          {
            name: 'AES-GCM',
            iv: decodeBase64(payload.iv),
            additionalData: decodeBase64(payload.aad),
            tagLength: 128
          },
          key,
          decodeBase64(payload.ciphertext)
        );
        return decoder.decode(plaintext);
      }

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        status.textContent = '正在解锁……';
        try {
          content.innerHTML = await decryptContent(input.value);
          gate.hidden = true;
          if (extras) extras.hidden = false;
          content.hidden = false;
          window.dispatchEvent(new CustomEvent('protected-content-unlocked'));
          content.focus();
        } catch (error) {
          status.textContent = '口令不对，这一页仍然锁着。';
          input.select();
        }
      });
    })();
  </script>
